<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>甜筒双狗</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { user-select: none; -webkit-user-select: none; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
      canvas:active { cursor: grabbing; }
      canvas:focus-visible { outline: 3px solid #f5a641; outline-offset: -3px; }
    </style>
  </head>
  <body>
    <canvas id="pet" width="192" height="208" role="button" tabindex="0" aria-label="甜筒双狗。单击打招呼，拖动位置，右键打开菜单。"></canvas>
    <script src="renderer.js"></script>
  </body>
